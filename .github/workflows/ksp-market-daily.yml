name: KSP Market T/E — daily market update

on:
  schedule:
    - cron: '10 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update market from Discord and news
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python3 ksp-stock-market/discord-market-bot.py
      - name: Commit market data
        run: |
          git config user.name "KSP Market T/E Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ksp-stock-market/market-data.json
          git diff --cached --quiet || git commit -m "chore: daily KSP Market T/E update"
          git push
